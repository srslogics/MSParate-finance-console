services:
  - type: web
    name: msparate-finance-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LEDGER_CUTOVER_DATE
        value: "1970-01-01"
